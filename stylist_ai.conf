<VirtualHost *:80>
    ServerName stylist-ai.com
    ServerAdmin webmaster@stylist-ai.com

    # Путь к статическим файлам
    Alias /static/ /var/www/stylist_ai/static/
    <Directory /var/www/stylist_ai/static>
        Require all granted
    </Directory>

    # Проксирование запросов к Gunicorn
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog ${APACHE_LOG_DIR}/stylist_ai_error.log
    CustomLog ${APACHE_LOG_DIR}/stylist_ai_access.log combined
</VirtualHost> 