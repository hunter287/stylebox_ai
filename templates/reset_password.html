<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля - Style Box AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 450px;
            width: 100%;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #bb279b;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .logo p {
            color: #6b7280;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #bb279b;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #bb279b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background: #8B1B6A;
        }

        .btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .error {
            color: #dc2626;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }

        .success {
            color: #059669;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #bb279b;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .password-requirements {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>Style Box AI</h1>
            <p>Восстановление пароля</p>
        </div>

        <form id="resetForm">
            <div class="form-group">
                <label for="password">Новый пароль</label>
                <input type="password" id="password" name="password" placeholder="Введите новый пароль" required>
                <div class="password-requirements">Минимум 6 символов</div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Подтвердите пароль</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Повторите новый пароль" required>
            </div>

            <button type="submit" class="btn" id="submitBtn">Изменить пароль</button>

            <div class="error" id="errorMessage"></div>
            <div class="success" id="successMessage"></div>
        </form>

        <div class="back-link">
            <a href="/">← Вернуться на главную</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('resetForm');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');
        const submitBtn = document.getElementById('submitBtn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        // Получаем токен из URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            showError('Недействительная ссылка для восстановления пароля');
            submitBtn.disabled = true;
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }

        function hideMessages() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            hideMessages();

            const passwordValue = password.value.trim();
            const confirmPasswordValue = confirmPassword.value.trim();

            // Валидация
            if (passwordValue.length < 6) {
                showError('Пароль должен содержать минимум 6 символов');
                return;
            }

            if (passwordValue !== confirmPasswordValue) {
                showError('Пароли не совпадают');
                return;
            }

            // Отправляем запрос
            submitBtn.disabled = true;
            submitBtn.textContent = 'Изменение пароля...';

            try {
                const response = await fetch('/reset_password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        token: token,
                        password: passwordValue
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess(data.message);
                    form.reset();
                    submitBtn.textContent = 'Пароль изменен!';
                    
                    // Перенаправляем на главную страницу через 3 секунды
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 3000);
                } else {
                    showError(data.error || 'Ошибка изменения пароля');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Изменить пароль';
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showError('Ошибка соединения с сервером');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Изменить пароль';
            }
        });
    </script>
</body>
</html>
